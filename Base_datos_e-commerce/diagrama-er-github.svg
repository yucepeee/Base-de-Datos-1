  <path class="line" d="M1120 45 L1000 90"/>
  <ellipse cx="1110" cy="190" rx="55" ry="28" class="attribute"/>
  <text x="1110" y="190" class="attribute-text">NIT</text>
  <path class="line" d="M1080 175 L1000 155"/>
  <ellipse cx="1250" cy="190" rx="75" ry="28" class="attribute"/>
  <text x="1250" y="190" class="attribute-text">Nacionalidad</text>
  <path class="line" d="M1190 175 L1010 150"/>

  <!-- Cardinalities -->
  <text x="300" y="405" class="cardinality">N:M</text>
  <text x="630" y="405" class="cardinality">N:M</text>
  <text x="950" y="405" class="cardinality">N:M</text>
  <text x="390" y="245" class="cardinality">N:M</text>
  <text x="850" y="215" class="cardinality">1:N</text>
  <text x="360" y="675" class="cardinality">1:N</text>
  <text x="1080" y="595" class="cardinality">N:M</text>
</svg>
