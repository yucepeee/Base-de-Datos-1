  <path class="line" d="M635 40 L530 90"/>

  <!-- Agent attributes -->
  <ellipse cx="1130" cy="555" rx="65" ry="32" class="attribute"/>
  <text x="1130" y="555" class="attribute-text">N&uacute;mero</text>
  <path class="line" d="M1130 523 L1130 490"/>
  <ellipse cx="1260" cy="555" rx="65" ry="32" class="attribute"/>
  <text x="1260" y="555" class="attribute-text">Nombre</text>
  <path class="line" d="M1260 523 L1280 465"/>
  <ellipse cx="1200" cy="680" rx="55" ry="32" class="attribute"/>
  <text x="1200" y="680" class="attribute-text">C.I.</text>
  <path class="line" d="M1180 650 L1160 490"/>
  <ellipse cx="1030" cy="820" rx="65" ry="32" class="attribute"/>
  <text x="1030" y="820" class="attribute-text">Ciudad</text>
  <path class="line" d="M1030 788 L1030 735"/>
  <ellipse cx="1220" cy="820" rx="85" ry="32" class="attribute"/>
