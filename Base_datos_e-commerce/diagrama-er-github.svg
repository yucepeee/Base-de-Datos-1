  <path class="line" d="M1180 800 L1070 750"/>

  <!-- Web attributes -->
  <ellipse cx="1030" cy="25" rx="60" ry="28" class="attribute"/>
  <text x="1030" y="25" class="attribute-text">Nombre</text>
  <path class="line" d="M990 45 L970 90"/>
  <ellipse cx="1160" cy="25" rx="55" ry="28" class="attribute"/>
