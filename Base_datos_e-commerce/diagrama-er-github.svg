  <path class="line" d="M255 105 L385 120"/>
  <ellipse cx="300" cy="25" rx="60" ry="28" class="attribute"/>
  <text x="300" y="25" class="attribute-text">Peso</text>
  <path class="line" d="M345 40 L420 90"/>
  <ellipse cx="680" cy="90" rx="75" ry="32" class="attribute"/>
  <text x="680" y="90" class="attribute-text">Mayorista</text>
  <path class="line" d="M605 105 L555 120"/>
  <ellipse cx="680" cy="25" rx="65" ry="28" class="attribute"/>
